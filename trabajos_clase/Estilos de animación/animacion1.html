<html>
<head>
    <title>ANIMACION 3 CSS</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
        }

        body {
            background-color: #6A0D0D;
            color: white;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
        }

        .contenedor{
            width: 400px;
            height: 200px;
            border: 1px solid black;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            background-color: white; 
        }

        .cuadrito{
            width: 100px;
            height: 100px;
            background-color: black;
            position: absolute;
            top: 0;
            left: 150px;
            animation: cuadrito 3s infinite linear;
        }

        @keyframes cuadrito{
            from{
                top: 0;
            }
            to{
                top: 100px;
            }
        }

        a {
            display: block;
            text-align: center;
            color: white;
            margin-top: 10px;
            text-decoration: none;
        }
    </style>
</head>    
<body>
    <h1>Estilo de Arriba a Abajo</h1>
    <div class="contenedor">
        <div class ="cuadrito"></div>
    </div>
    <br>
    <a href="index.html">Volver</a>
</body>
</html>
